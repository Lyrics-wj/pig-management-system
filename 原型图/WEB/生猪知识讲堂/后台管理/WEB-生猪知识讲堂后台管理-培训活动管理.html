      else if (this.tForm.start_time && this.tForm.end_time <= this.tForm.start_time) this.tFormErrors.end_time = '结束时间必须晚于开始时间';
      if (!this.tForm.enrollment_deadline) this.tFormErrors.enrollment_deadline = '请选择报名截止时间';
      else if (this.tForm.start_time && this.tForm.enrollment_deadline > this.tForm.start_time) this.tFormErrors.enrollment_deadline = '报名截止时间必须早于或等于开始时间';
      const m = parseInt(this.tForm.max_enrollment);
      if (isNaN(m)||m<1||m>9999) this.tFormErrors.max_enrollment = '最大报名人数须在1~9999之间';
      return Object.keys(this.tFormErrors).length === 0;
    },

    submitTForm() {
      if (!this.validateTForm()) return;
      const fmtTime = t => t.replace('T',' ');
      if (this.tFormMode === 'add') {
        this.trainings.push({ training_id: Date.now(), ...this.tForm, start_time: fmtTime(this.tForm.start_time), end_time: fmtTime(this.tForm.end_time), enrollment_deadline: fmtTime(this.tForm.enrollment_deadline), current_enrollment: 0, training_status: '0', publish_status: '0', publish_time: null, create_time: new Date().toLocaleString('zh-CN'), create_by: MOCK_DATA.currentUser.username, hasEnrollments: false });
        this.showToast('新增成功');
      } else {
        const idx = this.trainings.findIndex(t=>t.training_id===this.editingTraining.training_id);
        if (idx>-1) Object.assign(this.trainings[idx], { ...this.tForm, start_time: fmtTime(this.tForm.start_time), end_time: fmtTime(this.tForm.end_time), enrollment_deadline: fmtTime(this.tForm.enrollment_deadline) });
        this.showToast('修改成功');
      }
      this.tFormModal = false;
    },

    showConfirm(title, msg, action) { this.confirmTitle=title; this.confirmMsg=msg; this.confirmAction=action; this.confirmModal=true; },
    doConfirm() { if(this.confirmAction) this.confirmAction(); this.confirmModal=false; },

    changePubStatus(item, status) {
      const msgs = { '1': '确认发布该活动？发布后在网站端展示。', '2': '确认下架？下架后网站端将不可见。' };
      this.showConfirm(status==='1'?'发布活动':'下架活动', msgs[status], () => {
        item.publish_status = status;
        if (status==='1') item.publish_time = new Date().toLocaleString('zh-CN');
        this.showToast('操作成功');
      });
    },

    deleteTraining(item) {
      if (item.hasEnrollments) { this.showToast('该活动已有报名记录，不可删除', 'error'); return; }
      this.showConfirm('删除活动', `确认删除「${item.training_name}」？删除后不可恢复。`, () => {
        this.trainings = this.trainings.filter(t=>t.training_id!==item.training_id);
        this.showToast('删除成功');
      });
    },

    // 报名审批
    enrollments: JSON.parse(JSON.stringify(MOCK_DATA.enrollments)),
    selectedTrainingId: '',
    enrollFilter: '',
    selectedEnrollments: [],
    auditModal: false, auditType: 'approve', auditBatch: false, auditTargets: [], auditRemark: '',

    get currentTrainingEnrollments() {
      if (!this.selectedTrainingId) return [];
      return this.enrollments.filter(e => {
        if (e.training_id != this.selectedTrainingId) return false;
        if (this.enrollFilter !== '' && e.approval_status !== this.enrollFilter) return false;
        return true;
      });
    },

    get currentTrainingName() {
      const t = this.trainings.find(t=>t.training_id==this.selectedTrainingId);
      return t ? t.training_name : '请先选择活动';
    },

    get pendingEnrollments() {
      return this.currentTrainingEnrollments.filter(e=>e.approval_status==='0');
    },

    openAudit(type, enrollment=null, batch=false) {
      this.auditType = type;
      this.auditBatch = batch;
      this.auditRemark = '';
      this.auditTargets = batch ? this.pendingEnrollments : [enrollment];
      this.auditModal = true;
    },

    submitAudit() {
      const status = this.auditType==='approve' ? '1' : '2';
      this.auditTargets.forEach(target => {
        const e = this.enrollments.find(e=>e.enrollment_id===target.enrollment_id);
        if (e) {
          e.approval_status = status;
          e.approval_remark = this.auditRemark;
          e.approval_by = MOCK_DATA.currentUser.username;
          e.approval_time = new Date().toLocaleString('zh-CN');
        }
      });
      this.auditModal = false;
      this.showToast(this.auditType==='approve' ? '已通过审批' : '已拒绝');
    },

    exportEnrollments() {
      this.showToast('导出报名名单（模拟）：已生成Excel文件');
    },

    toast: { show: false, msg: '', type: 'success' },
    showToast(msg, type='success') { this.toast={show:true,msg,type}; setTimeout(()=>this.toast.show=false, 2500); },
  };
}
</script>

          <input type="datetime-local" class="form-input" :class="tFormErrors.enrollment_deadline?'border-red-400':''" x-model="tForm.enrollment_deadline">
          <p class="form-error" x-show="tFormErrors.enrollment_deadline" x-text="tFormErrors.enrollment_deadline"></p>
          <p class="text-xs text-gray-400 mt-1">必须早于或等于开始时间</p>
        </div>
        <div>
          <label class="form-label">最大报名人数 <span class="text-red-500">*</span></label>
          <input type="number" class="form-input" :class="tFormErrors.max_enrollment?'border-red-400':''" x-model="tForm.max_enrollment" min="1" max="9999" placeholder="最大报名人数">
          <p class="form-error" x-show="tFormErrors.max_enrollment" x-text="tFormErrors.max_enrollment"></p>
        </div>
        <div class="col-span-2">
          <label class="form-label">讲师简介</label>
          <textarea class="form-input" x-model="tForm.speaker_intro" rows="2" placeholder="讲师简介（选填）" maxlength="500"></textarea>
        </div>
        <div class="col-span-2">
          <label class="form-label">活动简介 <span class="text-red-500">*</span></label>
          <textarea class="form-input" :class="tFormErrors.training_intro?'border-red-400':''" x-model="tForm.training_intro" rows="4" placeholder="请输入活动简介（富文本）"></textarea>
          <p class="form-error" x-show="tFormErrors.training_intro" x-text="tFormErrors.training_intro"></p>
        </div>
      </div>
    </div>
    <div class="flex justify-end gap-3 px-5 py-4 border-t bg-gray-50 rounded-b-xl sticky bottom-0">
      <button class="btn-secondary" @click="tFormModal=false">取消</button>
      <button class="btn-primary" @click="submitTForm">保存</button>
    </div>
  </div>
</div>

<!-- 审批弹窗 -->
<div class="modal-overlay" x-show="auditModal" @click.self="auditModal=false">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
    <h3 class="font-semibold text-gray-800 mb-4">
      <span x-show="!auditBatch">审批 - </span>
      <span x-show="auditBatch">批量</span>
      <span x-text="auditType==='approve'?'通过':'拒绝'" :class="auditType==='approve'?'text-green-600':'text-red-600'"></span>
      <span x-show="auditBatch">（<span x-text="auditTargets.length"></span>条记录）</span>
    </h3>
    <template x-if="!auditBatch && auditTargets.length > 0">
      <div class="bg-gray-50 rounded-lg p-3 mb-4 text-sm">
        <div class="text-gray-700">报名人：<strong x-text="auditTargets[0].enrollee_name"></strong></div>
        <div class="text-gray-500 text-xs mt-1" x-text="auditTargets[0].enrollee_org||''"></div>
      </div>
    </template>
    <div class="mb-4">
      <label class="form-label">审批意见（选填）</label>
      <textarea class="form-input" x-model="auditRemark" rows="3" placeholder="请输入审批意见（选填）" maxlength="200"></textarea>
      <p class="text-xs text-gray-400 mt-1">拒绝时建议填写拒绝原因</p>
    </div>
    <div class="flex justify-end gap-3">
      <button class="btn-secondary" @click="auditModal=false">取消</button>
      <button class="btn-primary" :class="auditType==='approve'?'':'bg-red-500 hover:bg-red-600'" @click="submitAudit">确认</button>
    </div>
  </div>
</div>

<!-- 二次确认弹窗 -->
<div class="modal-overlay" x-show="confirmModal" @click.self="confirmModal=false">
  <div style="background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.15);width:100%;max-width:400px;padding:28px;animation:modal-in 0.2s ease">
    <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:20px">
      <div style="width:44px;height:44px;background:#fef3c7;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="fas fa-exclamation-triangle" style="color:#d97706;font-size:18px"></i>
      </div>
      <div>
        <h3 style="font-size:16px;font-weight:700;color:#0f172a;margin-bottom:6px" x-text="confirmTitle"></h3>
        <p style="font-size:13.5px;color:#64748b;line-height:1.5" x-text="confirmMsg"></p>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button class="btn-secondary" @click="confirmModal=false">取消</button>
      <button class="btn-primary" @click="doConfirm">
        <i class="fas fa-check" style="font-size:11px"></i> 确认操作
      </button>
    </div>
  </div>
</div>

<!-- Toast 提示 -->
<div style="position:fixed;bottom:24px;right:24px;z-index:100;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1)"
  :style="toast.show ? 'opacity:1;transform:translateY(0)' : 'opacity:0;transform:translateY(16px);pointer-events:none'">
  <div style="display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.12);font-size:13.5px;font-weight:600;color:#fff;min-width:200px"
    :style="toast.type==='error' ? 'background:linear-gradient(135deg,#ef4444,#dc2626)' : 'background:linear-gradient(135deg,#16a34a,#15803d)'">
    <div style="width:28px;height:28px;background:rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <i :class="toast.type==='error' ? 'fas fa-times' : 'fas fa-check'" style="font-size:12px"></i>
    </div>
    <span x-text="toast.msg"></span>
  </div>
</div>

</body>
</html>
