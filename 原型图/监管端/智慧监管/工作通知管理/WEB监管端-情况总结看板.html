<script>

  ]

function dashboardApp() {
  return {
    MOCK_DATA,
    currentUser: MOCK_DATA.users[0],
    trendFilter: '',
    overduePage: 1,
    overduePageSize: 10,
    chartInstance: null,

    switchRole(u) { this.currentUser = u; },
    canAccess() { return this.currentUser.role === 'county_admin' || this.currentUser.role === 'county_staff'; },

    get overdueTotalPages() { return Math.max(1, Math.ceil(MOCK_DATA.overdueList.length / this.overduePageSize)); },
    get pagedOverdueList() { return MOCK_DATA.overdueList.slice((this.overduePage-1)*this.overduePageSize, this.overduePage*this.overduePageSize); },

    init() {
      this.$nextTick(() => { this.renderChart(); });
    },

    refresh() {
      alert('数据刷新成功！（原型模拟）');
    },

    renderChart() {
      const canvas = document.getElementById('trendChart');
      if (!canvas) return;
      if (this.chartInstance) this.chartInstance.destroy();
      const data = MOCK_DATA.trendData;
      // 如按任务类型筛选，在mock数据上做微小随机扰动
      const getVals = (arr) => {
        if (!this.trendFilter) return arr;
        return arr.map(v => Math.max(0, Math.round(v * (0.3 + Math.random() * 0.4))));
      };
      this.chartInstance = new Chart(canvas, {
        type: 'line',
        data: {
          labels: data.labels,
          datasets: [
            { label: '下发数', data: getVals(data.dispatched), borderColor: '#1677ff', backgroundColor: 'rgba(22,119,255,0.1)', tension: 0.4, fill: false, pointRadius: 4, pointBackgroundColor: '#1677ff' },
            { label: '完成数', data: getVals(data.completed), borderColor: '#52c41a', backgroundColor: 'rgba(82,196,26,0.1)', tension: 0.4, fill: false, pointRadius: 4, pointBackgroundColor: '#52c41a' },
            { label: '超期数', data: getVals(data.overdue), borderColor: '#ff4d4f', backgroundColor: 'rgba(255,77,79,0.1)', tension: 0.4, fill: false, pointRadius: 4, pointBackgroundColor: '#ff4d4f' }
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', labels: { usePointStyle: true, font: { size: 12 } } },
            tooltip: {
              callbacks: {
                title: (items) => items[0].label,
                label: (item) => item.dataset.label + ': ' + item.raw + ' 条'
              }
            }
          },
          scales: {
            x: { grid: { color: '#f0f0f0' } },
            y: { grid: { color: '#f0f0f0' }, beginAtZero: true, ticks: { stepSize: 2 } }
          }
        }
      });
    },

    updateChart() {
      this.renderChart();
    }
  };
}
</script>
</body>
</html>
