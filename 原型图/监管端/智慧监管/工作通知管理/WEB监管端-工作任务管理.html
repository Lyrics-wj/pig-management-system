<!--
  功能名称：工作任务管理

  所属端口：WEB监管端
  所属模块：智慧监管 / 工作通知管理
  制作日期：2026-03-10
  最后更新：2026-03-10
  角色说明：county_admin（县级管理员）、county_staff（县级业务人员）、town_gov_staff（乡镇政府业务人员）、town_vet_station（乡镇畜牧兽医站）、ent_admin（企业管理员）
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作任务管理 - 2024年蓬溪县生猪数字化管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    /* SHARED STYLES */
    [x-cloak] { display: none !important; }
    body { font-size: 14px; }
    .sidebar-menu a.active { background-color: #1677ff; color: #fff; }
    .sidebar-menu a:hover:not(.active) { background-color: #e6f4ff; color: #1677ff; }
    .table-container { overflow-x: auto; }
    .data-table { min-width: 900px; border-collapse: collapse; width: 100%; }
    .data-table th { background: #fafafa; color: #595959; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid #e8e8e8; white-space: nowrap; }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    .data-table tr:hover td { background-color: #fafafa; }
    .data-table tr:nth-child(even) td { background-color: #fafafa; }
    .data-table .op-col { position: sticky; right: 0; background: #fff; }
    .data-table tr:nth-child(even) .op-col { background: #fafafa; }
    .data-table tr:hover .op-col { background: #fafafa; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .btn-primary { background: #1677ff; color: #fff; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-primary:hover { background: #4096ff; }
    .btn-default { background: #fff; color: #333; border: 1px solid #d9d9d9; padding: 5px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-default:hover { border-color: #1677ff; color: #1677ff; }
    .btn-link { background: none; border: none; padding: 2px 6px; cursor: pointer; font-size: 12px; }
    .btn-danger { background: none; border: none; padding: 2px 6px; cursor: pointer; font-size: 12px; color: #ff4d4f; }
    .form-input { border: 1px solid #d9d9d9; border-radius: 6px; padding: 6px 10px; font-size: 13px; width: 100%; box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: #1677ff; }
    .form-label { font-size: 13px; color: #333; margin-bottom: 4px; display: block; }
    .required::before { content: '*'; color: #ff4d4f; margin-right: 4px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: #fff; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); padding: 24px; position: relative; max-height: 90vh; overflow-y: auto; }
    .error-msg { color: #ff4d4f; font-size: 12px; margin-top: 2px; }
    .row-overdue td { background: #FFF0F0 !important; }
    .progress-bar-bg { background: #e8e8e8; border-radius: 4px; height: 6px; overflow: hidden; display: inline-block; width: 60px; vertical-align: middle; }
    .progress-bar-fill { background: #1677ff; height: 6px; border-radius: 4px; }
    .pagination { display: flex; align-items: center; gap: 4px; }
    .page-btn { border: 1px solid #d9d9d9; background: #fff; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .page-btn.active { background: #1677ff; color: #fff; border-color: #1677ff; }
    .page-btn:hover:not(.active) { border-color: #1677ff; color: #1677ff; }
    .detail-label { color: #8c8c8c; font-size: 13px; }
    .detail-value { color: #262626; font-size: 13px; }
    .richtext-render { line-height: 1.8; color: #333; }
  </style>
</head>
<body class="bg-gray-100" x-data="taskApp()">

<!-- SECTION START: 顶部导航栏 -->
<header class="fixed top-0 left-0 right-0 bg-white border-b border-gray-200 flex items-center px-4 z-50" style="height:60px;">
  <div class="flex items-center gap-3 flex-1">
    <i class="fa-solid fa-piggy-bank text-blue-500 text-xl"></i>
    <span class="font-bold text-gray-800 text-base">2024年蓬溪县生猪数字化管理平台</span>
    <span class="text-gray-300 mx-2">|</span>
    <span class="text-gray-500 text-sm">智慧监管</span>
  </div>
  <div class="flex items-center gap-4">
    <div class="relative" x-data="{open:false}">
      <button class="flex items-center gap-2 hover:bg-gray-100 px-3 py-1 rounded-lg" @click="open=!open">
        <i class="fa-solid fa-user-circle text-blue-500"></i>
        <span class="text-sm text-gray-700" x-text="currentUser.roleName"></span>
        <span class="text-xs text-gray-400" x-text="currentUser.name"></span>
        <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
      </button>
      <div x-show="open" @click.away="open=false" class="absolute right-0 top-10 bg-white border border-gray-200 rounded-lg shadow-lg z-50 w-52" x-cloak>
        <div class="px-3 py-2 text-xs text-gray-400 border-b">切换角色</div>
        <template x-for="u in MOCK_DATA.users" :key="u.id">
          <button class="w-full text-left px-4 py-2 text-sm hover:bg-blue-50 flex items-center gap-2"
            :class="currentUser.id===u.id?'text-blue-600 font-medium':'text-gray-700'"
            @click="switchRole(u);open=false">
            <i class="fa-solid fa-check text-blue-500 text-xs" x-show="currentUser.id===u.id"></i>
            <span x-show="currentUser.id!==u.id" class="w-3"></span>
            <span x-text="u.roleName+' - '+u.name"></span>
          </button>
        </template>
      </div>
    </div>
    <button class="btn-default text-xs" @click="alert('退出登录')"><i class="fa-solid fa-right-from-bracket mr-1"></i>退出</button>
  </div>
</header>
<!-- SECTION END: 顶部导航栏 -->

<div class="flex" style="padding-top:60px; min-height:100vh;">
  <!-- SECTION START: 侧边菜单 -->
  <aside class="fixed left-0 bottom-0 bg-white border-r border-gray-200 overflow-y-auto sidebar-menu" style="top:60px;width:220px;">
    <div class="py-3">
      <div class="px-4 py-1 text-xs text-gray-400 font-medium tracking-widest uppercase">智慧监管</div>
      <a href="WEB监管端-通知公告管理.html" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-600 rounded mx-2">
        <i class="fa-solid fa-bullhorn w-4"></i>通知公告管理
      </a>
      <a href="#" class="flex items-center gap-2 px-4 py-2 text-sm rounded mx-2 active">
        <i class="fa-solid fa-tasks w-4"></i>工作任务管理
      </a>
      <a href="WEB监管端-信息收集管理.html" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-600 rounded mx-2">
        <i class="fa-solid fa-database w-4"></i>信息收集管理
      </a>
      <a href="WEB监管端-情况总结看板.html" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-600 rounded mx-2">
        <i class="fa-solid fa-chart-line w-4"></i>情况总结看板
      </a>
    </div>
  </aside>
  <!-- SECTION END: 侧边菜单 -->

  <main class="flex-1 flex flex-col" style="margin-left:220px;">
    <div class="bg-white border-b border-gray-200 px-6 py-2 text-xs text-gray-400">
      <span>智慧监管</span> <span class="mx-1">></span> <span class="text-gray-700">工作任务管理</span>
    </div>

    <div class="flex-1 p-6 flex flex-col gap-4">
      <!-- SECTION START: 页面标题 -->
      <div id="feature-header" class="flex items-center justify-between">
        <h1 class="text-lg font-bold text-gray-800">
          <span x-show="isPublisher()">我下发的任务</span>
          <span x-show="!isPublisher()">我收到的任务</span>
        </h1>
        <button class="btn-primary" x-show="isPublisher()" @click="openAddModal()">
          <i class="fa-solid fa-plus mr-1"></i>新增
        </button>
      </div>
      <!-- SECTION END: 页面标题 -->

      <!-- SECTION START: 筛选区域 -->
      <section id="feature-filter" class="bg-white rounded-lg p-4 border border-gray-200">
        <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
          <div>
            <label class="form-label text-xs text-gray-500">任务名称</label>
            <input class="form-input" type="text" placeholder="请输入任务名称" x-model="filter.name">
          </div>
          <div>
            <label class="form-label text-xs text-gray-500">任务类型</label>
            <select class="form-input" x-model="filter.type">
              <option value="">全部</option>
              <option value="1">日常巡查</option>
              <option value="2">专项检查</option>
              <option value="3">数据报送</option>
              <option value="4">整改通知</option>
              <option value="5">其他</option>
            </select>
          </div>
          <template x-if="isPublisher()">
            <div>
              <label class="form-label text-xs text-gray-500">状态</label>
              <select class="form-input" x-model="filter.status">
                <option value="">全部</option>
                <option value="0">草稿</option>
                <option value="1">已下发</option>
                <option value="2">进行中</option>
                <option value="3">已完成</option>
                <option value="4">已撤回</option>
              </select>
            </div>
          </template>
          <template x-if="!isPublisher()">
            <div>
              <label class="form-label text-xs text-gray-500">反馈状态</label>
              <select class="form-input" x-model="filter.feedbackStatus">
                <option value="">全部</option>
                <option value="0">未反馈</option>
                <option value="1">已反馈</option>
              </select>
            </div>
          </template>
          <div>
            <label class="form-label text-xs text-gray-500">下发时间</label>
            <input class="form-input" type="date" x-model="filter.dateFrom">
          </div>
        </div>
        <div class="flex gap-2 mt-3">
          <button class="btn-primary text-xs" @click="page=1"><i class="fa-solid fa-search mr-1"></i>搜索</button>
          <button class="btn-default text-xs" @click="resetFilter()"><i class="fa-solid fa-rotate-right mr-1"></i>重置</button>
        </div>
      </section>
      <!-- SECTION END: 筛选区域 -->

      <!-- SECTION START: 数据表格 -->
      <section id="feature-list" class="bg-white rounded-lg border border-gray-200 flex flex-col" style="min-height:400px;">
        <div class="table-container flex-1">
          <!-- 下发方视角 -->
          <template x-if="isPublisher()">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="min-width:200px;">任务名称</th>
                  <th>任务类型</th>
                  <th>紧急程度</th>
                  <th>下发范围</th>
                  <th>反馈进度</th>
                  <th>填报期限</th>
                  <th>状态</th>
                  <th>超期</th>
                  <th>下发时间</th>
                  <th class="op-col" style="min-width:200px;">操作</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in pagedPublisherList" :key="item.task_id">
                  <tr>
                    <td><span class="truncate max-w-xs inline-block align-middle" :title="item.task_name" x-text="item.task_name"></span></td>
                    <td><span class="tag" :class="getTypeClass(item.task_type)" x-text="getTypeLabel(item.task_type)"></span></td>
                    <td><span class="tag" :class="getUrgencyClass(item.urgency_level)" x-text="getUrgencyLabel(item.urgency_level)"></span></td>
                    <td x-text="getScopeText(item)"></td>
                    <td>
                      <span class="text-xs mr-1" x-text="'已反馈'+item.feedback_count+'/共'+item.total_count"></span>
                      <div class="progress-bar-bg inline-block"><div class="progress-bar-fill" :style="'width:'+(item.total_count>0?Math.round(item.feedback_count/item.total_count*100):0)+'%'"></div></div>
                    </td>
                    <td x-text="item.deadline"></td>
                    <td><span class="tag" :class="getStatusClass(item.status)" x-text="getStatusLabel(item.status)"></span></td>
                    <td>
                      <span x-show="isTaskOverdue(item)" class="tag bg-red-100 text-red-600">超期</span>
                      <span x-show="!isTaskOverdue(item)" class="text-gray-300">—</span>
                    </td>
                    <td x-text="item.dispatch_time||'—'"></td>
                    <td class="op-col">
                      <template x-if="item.status==='0'">
                        <span class="flex gap-1 flex-wrap">
                          <button class="btn-link text-blue-500" @click="openEditModal(item)">编辑</button>
                          <button class="btn-link text-green-600" @click="dispatchTask(item)">下发</button>
                          <button class="btn-danger" @click="deleteTask(item)">删除</button>
                        </span>
                      </template>
                      <template x-if="item.status==='1'||item.status==='2'">
                        <span class="flex gap-1 flex-wrap">
                          <button class="btn-link text-blue-500" @click="viewTaskDetail(item)">查看</button>
                          <button class="btn-link text-orange-500" @click="revokeTask(item)">撤回</button>
                          <button class="btn-link text-purple-600" @click="viewFeedbackDetail(item)">反馈详情</button>
                          <button class="btn-link text-green-600" @click="completeTask(item)">标记完成</button>
                        </span>
                      </template>
                      <template x-if="item.status==='3'">
                        <span class="flex gap-1 flex-wrap">
                          <button class="btn-link text-blue-500" @click="viewTaskDetail(item)">查看</button>
                          <button class="btn-link text-purple-600" @click="viewFeedbackDetail(item)">反馈详情</button>
                        </span>
                      </template>
                      <template x-if="item.status==='4'">
                        <span class="flex gap-1 flex-wrap">
                          <button class="btn-link text-blue-500" @click="viewTaskDetail(item)">查看</button>
                        </span>
                      </template>
                    </td>
                  </tr>
                </template>
                <tr x-show="pagedPublisherList.length===0">
                  <td colspan="10" class="text-center text-gray-400 py-8">暂无数据</td>
                </tr>
              </tbody>
            </table>
          </template>

          <!-- 接收方视角 -->
          <template x-if="!isPublisher()">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="min-width:200px;">任务名称</th>
                  <th>任务类型</th>
                  <th>紧急程度</th>
                  <th>下发单位</th>
                  <th>下发人</th>
                  <th>填报期限</th>
                  <th>我的反馈状态</th>
                  <th>超期</th>
                  <th class="op-col" style="min-width:140px;">操作</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in pagedReceiverList" :key="item.task_id">
                  <tr :class="item.is_overdue==='1'&&item.my_feedback_status==='0'?'row-overdue':''">
                    <td><span class="truncate max-w-xs inline-block align-middle" :title="item.task_name" x-text="item.task_name"></span></td>
                    <td><span class="tag" :class="getTypeClass(item.task_type)" x-text="getTypeLabel(item.task_type)"></span></td>
                    <td><span class="tag" :class="getUrgencyClass(item.urgency_level)" x-text="getUrgencyLabel(item.urgency_level)"></span></td>
                    <td x-text="item.dispatch_dept"></td>
                    <td x-text="item.dispatch_by_name"></td>
                    <td x-text="item.deadline"></td>
                    <td>
                      <span class="tag" :class="item.my_feedback_status==='1'?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'" x-text="item.my_feedback_status==='1'?'已反馈':'未反馈'"></span>
                    </td>
                    <td>
                      <span x-show="item.is_overdue==='1'&&item.my_feedback_status==='0'" class="tag bg-red-100 text-red-600">超期</span>
                      <span x-show="!(item.is_overdue==='1'&&item.my_feedback_status==='0')" class="text-gray-300">—</span>
                    </td>
                    <td class="op-col">
                      <span class="flex gap-1 flex-wrap">
                        <button class="btn-link text-blue-500" @click="viewTaskDetail(item)">查看</button>
                        <button x-show="item.my_feedback_status==='0'" class="btn-link text-green-600" @click="openFeedbackModal(item)">提交反馈</button>
                        <button x-show="item.my_feedback_status==='1'" class="btn-link text-purple-600" @click="viewMyFeedback(item)">查看反馈</button>
                      </span>
                    </td>
                  </tr>
                </template>
                <tr x-show="pagedReceiverList.length===0">
                  <td colspan="9" class="text-center text-gray-400 py-8">暂无数据</td>
                </tr>
              </tbody>
            </table>
          </template>
        </div>

        <!-- 分页器 -->
        <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
          <span class="text-xs text-gray-400">共 <span x-text="isPublisher()?filteredPublisherList.length:filteredReceiverList.length"></span> 条</span>
          <div class="pagination">
            <button class="page-btn" :disabled="page===1" @click="page=Math.max(1,page-1)"><i class="fa-solid fa-chevron-left text-xs"></i></button>
            <template x-for="p in totalPages" :key="p">
              <button class="page-btn" :class="p===page?'active':''" @click="page=p" x-text="p"></button>
            </template>
            <button class="page-btn" :disabled="page===totalPages" @click="page=Math.min(totalPages,page+1)"><i class="fa-solid fa-chevron-right text-xs"></i></button>
          </div>
        </div>
      </section>
      <!-- SECTION END: 数据表格 -->
    </div>
  </main>
</div>

<!-- SECTION START: 新增/编辑任务弹窗 -->
<div id="feature-add-modal" class="modal-overlay" x-show="showFormModal" x-cloak @click.self="confirmClose()">
  <div class="modal-box" style="width:min(720px,95vw);">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-bold text-gray-800" x-text="editItem?'编辑任务':'新增任务'"></h2>
      <button @click="confirmClose()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <form @submit.prevent="submitForm('dispatch')">
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="form-label required">任务名称</label>
          <input class="form-input" type="text" placeholder="请输入任务名称（最多100字）" x-model="form.task_name" maxlength="100">
          <p class="error-msg" x-show="errors.task_name" x-text="errors.task_name"></p>
        </div>
        <div>
          <label class="form-label required">任务类型</label>
          <select class="form-input" x-model="form.task_type">
            <option value="">请选择任务类型</option>
            <option value="1">日常巡查</option>
            <option value="2">专项检查</option>
            <option value="3">数据报送</option>
            <option value="4">整改通知</option>
            <option value="5">其他</option>
          </select>
          <p class="error-msg" x-show="errors.task_type" x-text="errors.task_type"></p>
        </div>
        <div>
          <label class="form-label required">紧急程度</label>
          <select class="form-input" x-model="form.urgency_level">
            <option value="">请选择</option>
            <option value="0">普通</option>
            <option value="1">重要</option>
            <option value="2">紧急</option>
          </select>
          <p class="error-msg" x-show="errors.urgency_level" x-text="errors.urgency_level"></p>
        </div>
        <div class="col-span-2">
          <label class="form-label required">任务描述</label>
          <textarea class="form-input" rows="5" placeholder="请输入任务描述（支持富文本，此处用文本域模拟）" x-model="form.task_content"></textarea>
          <p class="error-msg" x-show="errors.task_content" x-text="errors.task_content"></p>
        </div>
        <div class="col-span-2">
          <label class="form-label">附件</label>
          <div class="border border-dashed border-gray-300 rounded-lg p-4 text-center cursor-pointer hover:border-blue-400" @click="alert('文件选择框（原型模拟）')">
            <i class="fa-solid fa-cloud-arrow-up text-gray-300 text-2xl"></i>
            <p class="text-xs text-gray-400 mt-1">点击上传附件（单文件≤20MB，总计≤100MB）</p>
          </div>
        </div>
        <div class="col-span-2">
          <label class="form-label required">下发范围</label>
          <div class="flex gap-4 mt-1">
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" x-model="form.scope_type" value="0"> 全部</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" x-model="form.scope_type" value="1"> 按机构</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" x-model="form.scope_type" value="2"> 按人员</label>
          </div>
          <p class="error-msg" x-show="errors.scope_type" x-text="errors.scope_type"></p>
        </div>
        <template x-if="form.scope_type==='1'">
          <div class="col-span-2">
            <label class="form-label required">选择目标机构</label>
            <div class="border border-gray-200 rounded-lg p-3 bg-gray-50 grid grid-cols-2 gap-1">
              <template x-for="dept in MOCK_DATA.depts" :key="dept.id">
                <label class="flex items-center gap-2 text-sm cursor-pointer">
                  <input type="checkbox" :value="dept.id" x-model="form.scope_value_arr">
                  <span x-text="dept.name"></span>
                </label>
              </template>
            </div>

    { user_id: 3, name: '张镇长', dept: '蓬溪镇人民政府', feedback_status: '1', feedback_time: '2026-03-03 14:22', is_overdue: '0', feedback_content: '已完成辖区内6个规模养殖场的日常防疫巡查，档案齐全，消毒记录规范，未发现异常。现场照片已随附件上传。' },
    { user_id: 4, name: '刘站长', dept: '蓬溪镇畜牧兽医站', feedback_status: '1', feedback_time: '2026-03-04 09:15', is_overdue: '0', feedback_content: '完成巡查，发现1家养殖场消毒记录不全，已督促整改，将在3月10日前复查。' },
    { user_id: 5, name: '陈经理', dept: '蓬溪县鑫源养殖场', feedback_status: '0', feedback_time: null, is_overdue: '0', feedback_content: null },
    { user_id: 6, name: '赵主任', dept: '新会镇人民政府', feedback_status: '1', feedback_time: '2026-03-05 16:40', is_overdue: '0', feedback_content: '已完成新会镇范围内4个养殖场的巡查，情况基本正常。' },
    { user_id: 7, name: '孙站长', dept: '新会镇畜牧兽医站', feedback_status: '0', feedback_time: null, is_overdue: '0', feedback_content: null },
    { user_id: 8, name: '李场长', dept: '明月镇鑫盛养殖场', feedback_status: '0', feedback_time: null, is_overdue: '0', feedback_content: null }
  ]
};

function taskApp() {
  return {
    MOCK_DATA,
    currentUser: MOCK_DATA.users[0],
    filter: { name: '', type: '', status: '', feedbackStatus: '', dateFrom: '' },
    page: 1, pageSize: 10,
    showFormModal: false, showDetailModal: false, showFeedbackModal: false,
    showFeedbackDetailModal: false, showFeedbackContentModal: false,
    editItem: null, detailItem: null, feedbackTask: null, feedbackDetailTask: null, feedbackContentItem: null,
    form: {}, errors: {},
    feedbackForm: { content: '' }, feedbackErrors: {},

    switchRole(u) { this.currentUser = u; this.page = 1; this.filter = { name: '', type: '', status: '', feedbackStatus: '', dateFrom: '' }; },
    isPublisher() { return this.currentUser.role === 'county_admin' || this.currentUser.role === 'county_staff'; },
    resetFilter() { this.filter = { name: '', type: '', status: '', feedbackStatus: '', dateFrom: '' }; this.page = 1; },

    get filteredPublisherList() {
      let list = MOCK_DATA.publisherTasks;
      if (this.filter.name) list = list.filter(t => t.task_name.includes(this.filter.name));
      if (this.filter.type) list = list.filter(t => t.task_type === this.filter.type);
      if (this.filter.status) list = list.filter(t => t.status === this.filter.status);
      return list;
    },
    get filteredReceiverList() {
      let list = MOCK_DATA.receiverTasks;
      if (this.filter.name) list = list.filter(t => t.task_name.includes(this.filter.name));
      if (this.filter.type) list = list.filter(t => t.task_type === this.filter.type);
      if (this.filter.feedbackStatus !== '') list = list.filter(t => t.my_feedback_status === this.filter.feedbackStatus);
      return list;
    },
    get totalPages() {
      const total = this.isPublisher() ? this.filteredPublisherList.length : this.filteredReceiverList.length;
      return Math.max(1, Math.ceil(total / this.pageSize));
    },
    get pagedPublisherList() { return this.filteredPublisherList.slice((this.page-1)*this.pageSize, this.page*this.pageSize); },
    get pagedReceiverList() { return this.filteredReceiverList.slice((this.page-1)*this.pageSize, this.page*this.pageSize); },

    isTaskOverdue(item) {
      if (!item.deadline || item.status === '0' || item.status === '4') return false;
      return new Date(item.deadline) < new Date() && item.feedback_count < item.total_count;
    },

    openAddModal() {
      this.editItem = null;
      this.form = { task_name:'', task_type:'', urgency_level:'', task_content:'', scope_type:'0', scope_value_arr:[], deadline:'', is_sms_notify:'0', require_attachment:'0' };
      this.errors = {};
      this.showFormModal = true;
    },
    openEditModal(item) {
      this.editItem = item;
      this.form = { ...item, scope_value_arr: item.scope_value ? JSON.parse(item.scope_value) : [] };
      this.errors = {};
      this.showFormModal = true;
    },
    confirmClose() {
      if (confirm('确认关闭？未保存的内容将丢失。')) this.showFormModal = false;
    },
    validate() {
      this.errors = {};
      if (!this.form.task_name) this.errors.task_name = '请输入任务名称';
      if (!this.form.task_type) this.errors.task_type = '请选择任务类型';
      if (this.form.urgency_level === '') this.errors.urgency_level = '请选择紧急程度';
      if (!this.form.task_content) this.errors.task_content = '请输入任务描述';
      if (!this.form.scope_type) this.errors.scope_type = '请选择下发范围';
      if (this.form.scope_type==='1' && this.form.scope_value_arr.length===0) this.errors.scope_value = '请选择目标机构';
      if (this.form.scope_type==='2' && this.form.scope_value_arr.length===0) this.errors.scope_value = '请选择目标人员';
      if (!this.form.deadline) this.errors.deadline = '请选择填报期限';
      return Object.keys(this.errors).length === 0;
    },
    submitForm(mode) {
      if (!this.validate()) return;
      const isDraft = mode === 'draft';
      if (this.editItem) {
        const idx = MOCK_DATA.publisherTasks.findIndex(t => t.task_id === this.editItem.task_id);
        if (idx > -1) Object.assign(MOCK_DATA.publisherTasks[idx], { ...this.form, status: isDraft?'0':'1', dispatch_time: isDraft?null:'2026-03-10 '+new Date().toTimeString().slice(0,5) });
      } else {
        const newId = Math.max(...MOCK_DATA.publisherTasks.map(t=>t.task_id)) + 1;
        MOCK_DATA.publisherTasks.push({ ...this.form, task_id: newId, status: isDraft?'0':'1', dispatch_time: isDraft?null:'2026-03-10 '+new Date().toTimeString().slice(0,5), create_by: this.currentUser.username, create_by_name: this.currentUser.name, dispatch_dept: this.currentUser.deptName, feedback_count: 0, total_count: isDraft?0:(this.form.scope_value_arr.length||25) });
      }
      alert(isDraft ? '草稿保存成功！' : '任务下发成功！');
      this.showFormModal = false;
    },
    dispatchTask(item) { if(confirm('确认下发此任务？')) { item.status='1'; item.dispatch_time='2026-03-10 '+new Date().toTimeString().slice(0,5); item.total_count=20; alert('任务已下发！'); } },
    revokeTask(item) { if(confirm('确认撤回该任务？撤回后未反馈的接收方将不再需要反馈。')) { item.status='4'; alert('任务已撤回。'); } },
    completeTask(item) {
      const unreported = item.total_count - item.feedback_count;
      if(confirm(`确认标记该任务为已完成？当前仍有 ${unreported} 人未反馈。`)) { item.status='3'; alert('已标记为完成。'); }
    },
    deleteTask(item) {
      if(confirm(`确认删除任务「${item.task_name}」吗？`)) { const idx=MOCK_DATA.publisherTasks.indexOf(item); if(idx>-1) MOCK_DATA.publisherTasks.splice(idx,1); alert('删除成功！'); }
    },
    viewTaskDetail(item) { this.detailItem = item; this.showDetailModal = true; },
    viewFeedbackDetail(item) { this.feedbackDetailTask = item; this.showFeedbackDetailModal = true; },
    openFeedbackModal(item) { this.feedbackTask = item; this.feedbackForm = { content: '' }; this.feedbackErrors = {}; this.showFeedbackModal = true; },
    submitFeedback() {
      this.feedbackErrors = {};
      if (!this.feedbackForm.content) { this.feedbackErrors.content = '请输入反馈内容'; return; }
      if (this.feedbackTask && this.feedbackTask.require_attachment === '1') { this.feedbackErrors.attachment = '此任务要求上传附件，请上传反馈附件'; return; }
      if (!confirm('确认提交反馈？提交后不可修改。')) return;
      const taskInList = MOCK_DATA.receiverTasks.find(t => t.task_id === this.feedbackTask.task_id);
      if (taskInList) taskInList.my_feedback_status = '1';
      alert('反馈提交成功！');
      this.showFeedbackModal = false;
    },
    viewMyFeedback(item) { this.feedbackContentItem = { feedback_content: '已完成辖区内相关养殖场的防疫巡查工作，情况正常，详见附件。' }; this.showFeedbackContentModal = true; },
    viewFeedbackContent(r) { this.feedbackContentItem = r; this.showFeedbackContentModal = true; },

    getTypeLabel(t) { return {1:'日常巡查',2:'专项检查',3:'数据报送',4:'整改通知',5:'其他'}[t]||t; },
    getTypeClass(t) { return {1:'bg-blue-100 text-blue-700',2:'bg-orange-100 text-orange-700',3:'bg-purple-100 text-purple-700',4:'bg-red-100 text-red-600',5:'bg-gray-100 text-gray-600'}[t]||'bg-gray-100 text-gray-500'; },
    getUrgencyLabel(l) { return {0:'普通',1:'重要',2:'紧急'}[l]||l; },
    getUrgencyClass(l) { return {0:'bg-gray-100 text-gray-500',1:'bg-orange-100 text-orange-700',2:'bg-red-100 text-red-700'}[l]||'bg-gray-100 text-gray-500'; },
    getStatusLabel(s) { return {0:'草稿',1:'已下发',2:'进行中',3:'已完成',4:'已撤回'}[s]||s; },
    getStatusClass(s) { return {0:'bg-gray-100 text-gray-500',1:'bg-blue-100 text-blue-700',2:'bg-orange-100 text-orange-600',3:'bg-green-100 text-green-700',4:'bg-red-100 text-red-600'}[s]||'bg-gray-100 text-gray-500'; },
    getScopeText(item) {
      if (item.scope_type==='0') return '全部';
      if (item.scope_type==='1') return (item.scope_value?JSON.parse(item.scope_value).length:0)+'个机构';
      if (item.scope_type==='2') return (item.scope_value?JSON.parse(item.scope_value).length:0)+'人';
      return '—';
    }
  };
}
</script>
</body>
</html>
