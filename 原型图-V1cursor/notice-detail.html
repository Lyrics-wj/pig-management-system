<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #16a34a; --primary-dark: #15803d;
    --danger: #ef4444; --warning: #f59e0b; --secondary: #0ea5e9; --purple: #8b5cf6;
    --bg: #f0fdf4; --text: #14532d; --text-secondary: #4b7c59; --text-muted: #86a892;
    --border: rgba(22,163,74,0.15); --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 16px; --radius-sm: 10px;
    --glass: rgba(255,255,255,0.85); --glass-border: rgba(255,255,255,0.6);
  }
  body { font-family: 'Noto Sans SC', -apple-system, sans-serif; background: var(--bg); color: var(--text); max-width: 390px; margin: 0 auto; min-height: 100vh; }
  ::-webkit-scrollbar { width: 0; }

  /* Nav Bar */
  .nav-bar {
    position: sticky; top: 0; z-index: 100;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; padding-top: 44px;
  }
  .nav-back {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(22,163,74,0.08); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .nav-back svg { width: 18px; height: 18px; stroke: var(--text); fill: none; stroke-width: 2; }
  .nav-title { flex: 1; font-size: 16px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-actions { display: flex; gap: 8px; }
  .nav-action-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(22,163,74,0.08); border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .nav-action-btn svg { width: 18px; height: 18px; stroke: var(--text-secondary); fill: none; stroke-width: 1.8; }

  /* Content */
  .content { padding: 0 0 80px; }

  /* Notice Header */
  .notice-header {
    background: white;
    padding: 20px 16px 16px;
    border-bottom: 1px solid rgba(22,163,74,0.08);
  }
  .notice-type-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .notice-type-tag {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 6px;
  }
  .type-system { background: rgba(22,163,74,0.1); color: var(--primary); }
  .type-policy { background: rgba(14,165,233,0.1); color: var(--secondary); }
  .type-activity { background: rgba(249,115,22,0.1); color: #f97316; }
  .type-warning { background: rgba(239,68,68,0.1); color: var(--danger); }
  .notice-top-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: rgba(239,68,68,0.08); color: var(--danger); font-weight: 600;
  }
  .notice-important-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: rgba(245,158,11,0.1); color: var(--warning); font-weight: 600;
  }
  .notice-title {
    font-size: 18px; font-weight: 700; color: var(--text);
    line-height: 1.5; margin-bottom: 12px;
  }
  .notice-meta { display: flex; flex-direction: column; gap: 5px; }
  .notice-meta-row { display: flex; align-items: center; gap: 6px; }
  .notice-meta-row svg { width: 14px; height: 14px; stroke: var(--text-muted); fill: none; stroke-width: 1.8; flex-shrink: 0; }
  .notice-meta-text { font-size: 12px; color: var(--text-muted); }
  .notice-read-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--primary); background: rgba(22,163,74,0.08);
    padding: 2px 8px; border-radius: 6px; margin-top: 6px;
  }
  .notice-read-badge svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* Body */
  .notice-body {
    padding: 20px 16px;
    background: white;
    margin-top: 8px;
  }
  .notice-body-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
  .notice-richtext {
    font-size: 15px; color: var(--text); line-height: 1.8;
  }
  .notice-richtext p { margin-bottom: 14px; }
  .notice-richtext strong { font-weight: 600; color: var(--text); }
  .notice-richtext ul { padding-left: 20px; margin-bottom: 14px; }
  .notice-richtext li { margin-bottom: 6px; }
  .notice-richtext .highlight-box {
    background: rgba(22,163,74,0.06); border-left: 3px solid var(--primary);
    padding: 12px 14px; border-radius: 0 8px 8px 0; margin: 14px 0;
    font-size: 14px;
  }
  .notice-richtext .warning-box {
    background: rgba(245,158,11,0.08); border-left: 3px solid var(--warning);
    padding: 12px 14px; border-radius: 0 8px 8px 0; margin: 14px 0;
    font-size: 14px; color: #92400e;
  }
  .notice-img {
    width: 100%; border-radius: 10px; margin: 14px 0;
    background: linear-gradient(135deg, #dcfce7, #bbf7d0);
    height: 160px; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(22,163,74,0.1);
  }
  .notice-img svg { width: 40px; height: 40px; stroke: rgba(22,163,74,0.4); fill: none; stroke-width: 1.5; }
  .notice-img-caption { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: -10px; margin-bottom: 14px; }

  /* Attachments */
  .attachments-section {
    padding: 16px;
    background: white;
    margin-top: 8px;
  }
  .attachments-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .attachments-title svg { width: 16px; height: 16px; stroke: var(--primary); fill: none; stroke-width: 1.8; }
  .attachment-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: var(--radius-sm);
    background: rgba(22,163,74,0.04); border: 1px solid rgba(22,163,74,0.1);
    margin-bottom: 8px; cursor: pointer;
    transition: background 0.15s;
  }
  .attachment-item:last-child { margin-bottom: 0; }
  .attachment-item:active { background: rgba(22,163,74,0.08); }
  .attachment-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .attachment-icon svg { width: 20px; height: 20px; fill: none; stroke-width: 1.8; }
  .icon-pdf { background: rgba(239,68,68,0.1); }
  .icon-pdf svg { stroke: var(--danger); }
  .icon-word { background: rgba(14,165,233,0.1); }
  .icon-word svg { stroke: var(--secondary); }
  .icon-img { background: rgba(22,163,74,0.1); }
  .icon-img svg { stroke: var(--primary); }
  .attachment-info { flex: 1; min-width: 0; }
  .attachment-name { font-size: 13px; color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attachment-size { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .attachment-download {
    font-size: 12px; color: var(--primary); background: rgba(22,163,74,0.1);
    padding: 5px 10px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;
  }

  /* Error State */
  .error-state {
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 32px; text-align: center;
  }
  .error-state.show { display: flex; }
  .error-icon { width: 80px; height: 80px; border-radius: 50%; background: rgba(239,68,68,0.08); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .error-icon svg { width: 36px; height: 36px; stroke: var(--danger); fill: none; stroke-width: 1.5; }
  .error-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .error-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }
  .error-back-btn { padding: 11px 28px; background: var(--primary); border: none; border-radius: var(--radius-sm); color: white; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }

  /* Bottom Actions */
  .bottom-actions {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 390px; background: var(--glass);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--glass-border);
    padding: 10px 16px 24px;
    display: flex; gap: 10px; z-index: 100;
  }
  .action-btn {
    flex: 1; padding: 11px;
    border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: opacity 0.15s;
  }
  .action-btn svg { width: 16px; height: 16px; fill: none; stroke-width: 1.8; }
  .action-btn-back { background: rgba(22,163,74,0.08); border: 1px solid rgba(22,163,74,0.15); color: var(--text-secondary); }
  .action-btn-back svg { stroke: var(--text-secondary); }
  .action-btn-share { background: var(--primary); border: none; color: white; }
  .action-btn-share svg { stroke: white; }

  /* Toast */
  .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: white; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 500; display: none; }
  .toast.show { display: block; }

  /* Notices selector (for demo) */
  .demo-selector {
    padding: 12px 16px;
    background: rgba(22,163,74,0.04);
    border-bottom: 1px solid rgba(22,163,74,0.08);
    display: flex; align-items: center; gap: 8px;
  }
  .demo-selector label { font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
  .demo-selector select { flex: 1; padding: 6px 10px; border: 1px solid rgba(22,163,74,0.2); border-radius: 8px; font-size: 12px; font-family: inherit; outline: none; background: white; }
  .demo-selector button { padding: 6px 12px; background: var(--primary); border: none; border-radius: 8px; color: white; font-size: 12px; cursor: pointer; font-family: inherit; }
</style>
</head>

        { name: '培训活动日程安排.pdf', size: '320 KB', type: 'pdf' },
        { name: '培训地点地图.jpg', size: '180 KB', type: 'img' },
      ]
    },
    '4': {
      type: 'warning', typeLabel: '预警通知', typeClass: 'type-warning',
      title: '【紧急】关于加强非洲猪瘟防控工作的预警通知',
      source: '蓬溪县农业农村局',
      time: '2026-02-26 16:45',
      isTop: true, isImportant: true,
      body: `
        <p>各养殖企业、养殖户：</p>
        <div class="warning-box">
          ⚠️ <strong>紧急预警</strong>：据省农业农村厅通报，近期周边县市发现疑似非洲猪瘟疫情，请各养殖主体立即提高防控等级，严格落实各项防控措施。

        <div class="highlight-box">

      `,
      attachments: [
        { name: '非洲猪瘟防控技术指南（2026版）.pdf', size: '3.5 MB', type: 'pdf' },

  function loadNotice(id) {
    const notice = notices[id];
    const normalState = document.getElementById('normalState');
    const errorState = document.getElementById('errorState');
    const bottomActions = document.getElementById('bottomActions');

    if (!notice) {
      normalState.style.display = 'none';
      errorState.classList.add('show');
      bottomActions.style.display = 'none';
      document.getElementById('navTitle').textContent = '通知详情';
      return;
    }

    normalState.style.display = 'block';
    errorState.classList.remove('show');
    bottomActions.style.display = 'flex';

    // Update nav title
    const shortTitle = notice.title.length > 12 ? notice.title.substring(0, 12) + '...' : notice.title;
    document.getElementById('navTitle').textContent = shortTitle;

    // Type tag
    const typeTag = document.getElementById('noticeTypeTag');
    typeTag.textContent = notice.typeLabel;
    typeTag.className = 'notice-type-tag ' + notice.typeClass;

    // Top / Important
    document.getElementById('noticeTopTag').style.display = notice.isTop ? 'inline-flex' : 'none';
    document.getElementById('noticeImportantTag').style.display = notice.isImportant ? 'inline-flex' : 'none';

    // Title, source, time
    document.getElementById('noticeTitle').textContent = notice.title;
    document.getElementById('noticeSource').textContent = notice.source;
    document.getElementById('noticeTime').textContent = notice.time;

    // Body
    document.getElementById('noticeBody').innerHTML = '<div class="notice-richtext">' + notice.body + '</div>';

    // Attachments
    const attSection = document.getElementById('attachmentsSection');
    const attList = document.getElementById('attachmentsList');
    if (notice.attachments && notice.attachments.length > 0) {
      attSection.style.display = 'block';
      attList.innerHTML = notice.attachments.map(att => {
        const iconClass = att.type === 'pdf' ? 'icon-pdf' : att.type === 'word' ? 'icon-word' : 'icon-img';
        const iconSvg = att.type === 'pdf'
          ? '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>'
          : att.type === 'word'
          ? '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
          : '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
        return `
          <div class="attachment-item" onclick="downloadAttachment('${att.name}')">
            <div class="attachment-icon ${iconClass}">${iconSvg}</div>
            <div class="attachment-info">
              <div class="attachment-name">${att.name}</div>
              <div class="attachment-size">${att.size}</div>
            </div>
            <div class="attachment-download">下载</div>
          </div>
        `;
      }).join('');
    } else {
      attSection.style.display = 'none';
    }

    // Mark as read (simulate)
    document.getElementById('readBadge').style.display = 'inline-flex';
  }

  function downloadAttachment(name) {
    showToast('正在下载：' + name);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  }

  // Load from URL param or default
  const urlParams = new URLSearchParams(window.location.search);
  const noticeId = urlParams.get('id') || '1';
  document.getElementById('noticeSelector').value = noticeId;
  loadNotice(noticeId);
</script>
</body>
